*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}

<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://script.google.com/macros/s/AKfycbxsFCrX7WCO3MaAH-PZPFS4j84Ko65szVZ5-ru9dDbaxo0JUUN3x0k8Uo9fq9EdVS5V/exec';
let cfg=JSON.parse(localStorage.cfg||'{}'),S=JSON.parse(localStorage.cache||'{"Halls":[],"Quotes":[],"Checklist":[],"Scores":[],"Budget":[]}'),tab='ck';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const won=n=>Math.round(n/1e4).toLocaleString('ko-KR')+'만원';
S.Scores=S.Scores||[];S.Budget=S.Budget||[];
const CRIT=[['meal','식사'],['vibe','홀 분위기'],['access','교통·주차'],['flow','동선·편의'],['gap','예식 여유']];
const getW=()=>{const r=(S.Scores||[]).find(x=>x.id=='_w')||{};return{c1:+r.c1||3,c2:+r.c2||3,c3:+r.c3||3,c4:+r.c4||3,c5:+r.c5||3,c6:+r.c6||4,c7:+r.c7||150}};
const base=()=>getW().c7;
const fees=q=>(+q.hall_fee||0)+(+q.flower||0)+(+q.extra||0)-(+q.discount||0);
const complete=q=>+q.hall_fee>0&&+q.meal>0;
const tot=q=>fees(q)+(+q.meal||0)*(+q.guests||base());
const costAt=q=>fees(q)+(+q.meal||0)*Math.max(base(),+q.guests||0);
const hallCost=h=>{const c=S.Quotes.filter(q=>q.hall==h.id&&complete(q)).map(costAt);return c.length?Math.min(...c):null};
function priceScores(){const c=S.Halls.map(h=>[h.id,hallCost(h)]).filter(x=>x[1]!=null),o={};if(!c.length)return o;const lo=Math.min(...c.map(x=>x[1])),hi=Math.max(...c.map(x=>x[1]));c.forEach(([id,v])=>o[id]=hi==lo?5:Math.round((5-4*(v-lo)/(hi-lo))*10)/10);return o}
function ranking(){const W=getW(),ps=priceScores();return S.Halls.map(h=>{const sr=(S.Scores||[]).find(x=>x.id==h.id)||{};let num=0,den=0,n=0;CRIT.forEach((c,i)=>{const v=+sr['c'+(i+1)]||0,w=W['c'+(i+1)];if(v){num+=v*w;den+=5*w;n++}});const p=ps[h.id];if(p!=null){num+=p*W.c6;den+=5*W.c6;n++}return{h,sr,p,n,cost:hallCost(h),total:den&&n>=3?Math.round(num/den*100):null}}).sort((a,b)=>(b.total??-1)-(a.total??-1))}
let wOpen=false;
const fw=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const qNo=q=>S.Quotes.filter(x=>x.hall==q.hall).indexOf(q)+1;
const vv=(v,f)=>String(v??'')===''?'<span class="ev">비어있음</span>':(f?f(v):E(v));
function hallCalc(r){r=r||{};const h=S.Halls.find(x=>x.id==r.hall);if(!h)return{h:null,q:null,amount:+r.amount||0,auto:false};
 const L=S.Quotes.filter(q=>q.hall==h.id);let q=r.quote?L.find(x=>x.id==r.quote):null;
 if(!q)q=L.filter(complete).sort((a,b)=>costAt(a)-costAt(b))[0];
 if(q&&complete(q))return{h,q,amount:costAt(q),auto:true,n:Math.max(base(),+q.guests||0)};
 return{h,q:null,amount:+r.amount||0,auto:false}}
function bparts(){const rows=S.Budget,hr=rows.find(x=>x.id=='b_hall'),items=rows.filter(x=>x.id!='b_hall'&&x.id!='_goal'),goal=+((rows.find(x=>x.id=='_goal')||{}).amount)||0,hc=hallCalc(hr),sum=items.reduce((a,x)=>a+(+x.amount||0),0),fixed=(hr&&hr.fixed=='Y'?hc.amount:0)+items.filter(x=>x.fixed=='Y').reduce((a,x)=>a+(+x.amount||0),0);return{hr,items,goal,hc,sum,total:hc.amount+sum,fixed}}
function bSum(){const{goal,total,fixed}=bparts(),left=goal-total;return`<div class="tag">예상 총 비용</div><div class="big">${fw(total)}</div>`+(goal?`<div class="bar"><b style="width:${Math.min(100,total/goal*100)}%;${total>goal?'background:var(--warn)':''}"></b></div><div class="tag">목표 ${won(goal)} · ${left>=0?'남음 '+won(left):'<span style="color:var(--warn)">초과 '+won(-left)+'</span>'}</div>`:'<div class="tag">목표 예산을 입력하면 남은 금액이 보여요</div>')+`<div class="tag">확정 ${won(fixed)} · 미정 ${won(total-fixed)}</div>`}
function bSim(){const{sum,total,hc}=bparts(),L=S.Halls.map(h=>({h,c:hallCost(h)})).filter(x=>x.c!=null).sort((a,b)=>a.c-b.c);if(!L.length)return'<div class="tag">완성된 견적이 있는 웨딩홀이 없어요</div>';return L.map(x=>{const t=sum+x.c,d=t-total,sel=hc.h&&hc.h.id==x.h.id;return`<div class="q"><div><b>${E(x.h.name)}</b><div class="tag">웨딩홀 ${won(x.c)}</div></div><div style="text-align:right"><b>${won(t)}</b><div class="tag">${sel?'지금 선택':d==0?'동일':(d>0?'+':'−')+won(Math.abs(d))}</div></div></div>`}).join('')}
function refreshB(){const a=$('#bsum'),b=$('#bsim');if(a)a.innerHTML=bSum();if(b)b.innerHTML=bSim()}

async function seedOnce(d){

    if(!ex){if(first){S.Quotes.push(q);up.push(q)}continue}
    const m={...ex};let ch=false;NEWF.forEach(f=>{if(emp(ex[f])&&!emp(q[f])){m[f]=q[f];ch=true}});

 }

 const L=hc.h?S.Quotes.filter(q=>q.hall==hc.h.id):[];
 const qo='<option value="">최저 견적 자동 선택</option>'+L.map(q=>`<option value="${q.id}" ${hr&&hr.quote==q.id?'selected':''}>견적 ${qNo(q)} · ${E([q.wdate,q.time].filter(Boolean).join(' ')||'날짜 비어있음')}${complete(q)?'':' (정보 부족)'}</option>`).join('');
 let det='';
 if(hc.auto){const q=hc.q,R=(l,v)=>`<dt>${l}</dt><dd>${v}</dd>`;det=`<dl class="qd" style="margin-top:10px">${R('기준 견적','견적 '+qNo(q))}${R('대관료',vv(q.hall_fee,x=>fw(+x)))}${R('생화장식',vv(q.flower,x=>fw(+x)))}${R('식대',fw(+q.meal)+' × '+hc.n+'명 = '+fw(q.meal*hc.n))}${R('기타 추가금',vv(q.extra,x=>fw(+x)))}${R('할인·혜택',vv(q.discount,x=>'−'+fw(+x)))}${R('합계',`<b>${fw(hc.amount)}</b>`)}</dl>`}
 else if(hc.h)det=`<p class="tag" style="margin:10px 0 0">이 웨딩홀은 대관료·식대가 채워진 견적이 없어요. 견적 탭에서 입력하거나 임시 금액을 넣으세요.</p><div class="bi" style="border:0"><span style="flex:1">임시 금액</span><input class="ba" type="number" inputmode="numeric" data-bk="b_hall|amount" data-man="1" value="${man(+hr.amount)}"><span class="tag">만원</span></div>`;
 else det=`<div class="bi" style="border:0"><span style="flex:1">웨딩홀 금액</span><input class="ba" type="number" inputmode="numeric" data-bk="b_hall|amount" data-man="1" value="${man(hr?+hr.amount:0)}"><span class="tag">만원</span></div>`;
 return`<p class="note">웨딩홀을 고르면 견적이 바로 반영돼요. 나머지 항목은 만원 단위로 입력하고, 정해진 항목은 체크하세요.</p>
 <div class="card"><div id="bsum">${bSum()}</div><label class="f" for="goal">목표 예산(만원)</label><input id="goal" class="goal" type="number" inputmode="numeric" data-bk="_goal|amount" data-man="1" value="${man(goal)}"></div>
 <div class="card"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">웨딩홀</h3><label class="tag" style="display:flex;gap:6px;align-items:center">확정<input type="checkbox" style="width:20px;height:20px;accent-color:var(--g)" data-bk="b_hall|fixed" ${hr&&hr.fixed=='Y'?'checked':''}></label></div>
 <label class="f">웨딩홀</label><select class="bsel" data-bk="b_hall|hall">${ho}</select>${hc.h?`<label class="f">견적</label><select class="bsel" data-bk="b_hall|quote">${qo}</select>`:''}
 <label class="f">예상 하객 수(명) · 보증인원이 더 많으면 보증인원 기준</label><input class="goal" type="number" inputmode="numeric" data-w="c7" value="${base()}">${det}</div>
 <div class="card"><h3 style="margin:0 0 4px">그 외 항목</h3>${items.length?items.map(x=>`<div class="bi"><input type="checkbox" data-bk="${x.id}|fixed" ${x.fixed=='Y'?'checked':''} aria-label="확정"><input class="bn" data-bk="${x.id}|name" value="${E(x.name)}"><input class="ba" type="number" inputmode="numeric" placeholder="0" data-bk="${x.id}|amount" data-man="1" value="${man(+x.amount)}"><span class="tag">만원</span><button class="x" data-db="${x.id}" aria-label="삭제">×</button></div>`).join(''):'<div class="empty">항목이 없어요. 아래에서 추가하세요.</div>'}<button class="add" data-ab>+ 항목 추가</button></div>
 <div class="card"><h3 style="margin:0 0 4px">웨딩홀을 바꾸면?</h3><div id="bsim">${bSim()}</div><p class="tag">각 웨딩홀의 최저 견적으로 바꿨을 때 총 비용이에요.</p></div>`}
function render(){head();$('#main').innerHTML={ck:viewCk,h:viewH,q:viewQ,r:viewR,b:viewB}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.addEventListener('click',e=>{const t=e.target,g=a=>t.dataset[a];
 if(t.dataset.t){tab=g('t');render();scrollTo(0,0)}
 else if(t.id=='cfgb')openCfg();
 else if(g('del')!=null)del('Checklist',g('del'));
 else if(g('add')){const x=prompt('추가할 항목');if(x)save('Checklist',{id:uid(),phase:g('add'),text:x,done:''})}
 else if(t.dataset.addp!=null){const p=prompt('새 단계 이름');const x=p&&prompt('첫 항목');if(x)save('Checklist',{id:uid(),phase:p,text:x,done:''})}
 else if(t.dataset.newh!=null)form('Halls',HF,{},'웨딩홀 추가');
 else if(g('eh'))form('Halls',HF,S.Halls.find(x=>x.id==g('eh')),'웨딩홀 수정');
 else if(g('dh'))del('Halls',g('dh'));
 else if(g('nq')!=null){if(!S.Halls.length)return toast('웨딩홀을 먼저 추가하세요');form('Quotes',QF,{hall:g('nq')||S.Halls[0].id},'견적 추가')}
 else if(g('eq'))form('Quotes',QF,S.Quotes.find(x=>x.id==g('eq')),'견적 수정');
 else if(g('dq'))del('Quotes',g('dq'))
 else if(t.dataset.ab!=null){const n=prompt('항목 이름');if(n)save('Budget',{id:uid(),name:n,amount:'',fixed:'',hall:'',quote:'',memo:''})}
 else if(g('db'))del('Budget',g('db'))
 else if(g('sc')){const[hid,c,v]=g('sc').split('|');const cur=(S.Scores||[]).find(x=>x.id==hid)||{};const row={id:hid,c1:'',c2:'',c3:'',c4:'',c5:'',c6:'',c7:'',...cur};row[c]=String(row[c])==v?'':v;save('Scores',row)}});
document.addEventListener('change',e=>{const bk=e.target.dataset.bk;if(bk){const[id,f]=bk.split('|'),el=e.target;let v=el.type=='checkbox'?(el.checked?'Y':''):el.value;if(el.dataset.man)v=v===''?'':String(Math.round((+v||0)*1e4));let row=S.Budget.find(x=>x.id==id)||{id,name:id=='b_hall'?'웨딩홀':id=='_goal'?'목표 예산':'',amount:'',fixed:'',hall:'',quote:'',memo:''};row={...row,[f]:v};if(id=='b_hall'&&f=='hall')row.quote='';save('Budget',row,!(id=='b_hall'&&(f=='hall'||f=='quote')));refreshB();return}
const w=e.target.dataset.w;if(w){const W=getW();W[w]=Math.max(1,+e.target.value||(w=='c7'?150:3));if(tab=='r')wOpen=true;save('Scores',{id:'_w',...W});return}const id=e.target.dataset.id;if(!id)return;const x=S.Checklist.find(i=>i.id==id);const o=document.querySelector(`details[data-p="${CSS.escape(x.phase)}"]`).open;save('Checklist',{...x,done:e.target.checked?'Y':''});const d=document.querySelector(`details[data-p="${CSS.escape(x.phase)}"]`);if(d)d.open=true});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();load();
</script></body></html>
